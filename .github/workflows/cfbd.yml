name: CFBD collect
on:
  push:
    branches: [main]
    paths: ["collect/run.json"]   # only an edited run.json starts a push run
  schedule:
    - cron: "23 14 * * 0"   # Sundays 14:23 UTC (9:23 AM Central): last completed week, ~10 calls
  workflow_dispatch:
    inputs:
      weekly:
        description: "Run the weekly job (auto year/week) instead of collect/run.json"
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: cfbd-collect
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect from CFBD
        env:
          CFBD_API_KEY: ${{ secrets.CFBD_API_KEY }}
          CFBD_JOB: ${{ (github.event_name == 'schedule' || inputs.weekly) && 'weekly' || '' }}
        run: python collect/cfbd.py
      - name: Commit data
        if: always()
        run: |
          git config user.name "cfbd-collector"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet && exit 0
          if [ -n "$CFBD_JOB" ]; then MSG="CFBD data: weekly (scheduled)"; else MSG="CFBD data: $(python -c 'import json;r=json.load(open("collect/run.json"));print(r["job"], r.get("year", r.get("years")))')"; fi
          git commit -m "$MSG"
          git pull --rebase -q || true
          git push
        env:
          CFBD_JOB: ${{ (github.event_name == 'schedule' || inputs.weekly) && 'weekly' || '' }}
